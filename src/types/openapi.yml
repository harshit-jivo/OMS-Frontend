          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderStatusUpdateForbidden'
          description: 'Either the order is not assigned to this user for rate approval
            (the view''s own `{"message": ...}`) or DRF refused the request (the `detail`/`message`/`error`/`success`
            envelope). The two do not share a key, so both are optional here.'
        '404':
