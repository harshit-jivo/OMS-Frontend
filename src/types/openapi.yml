            land here (staff update, standard update, distributor edit) and their
            key sets differ; see the per-field notes on the schema.
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCreateResult'
          description: A CREATE — no `order_id` in the request. Three branches land
            here (staff, standard, distributor) and their key sets differ; see the
            per-field notes on the schema.
        '400':
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    error:
                      type: string
                  required:
                  - error
                  description: One of the four explicit guards in the view.
                - type: object
                  additionalProperties: true
                  description: 'Raw DRF validation errors from CreateOrderSerializer,
                    keyed by field name. Deliberately untyped: which keys appear depends
                    on which fields failed, and `items` errors nest by index. No error
                    envelope — this branch returns the errors dict directly rather
                    than raising.'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderLifecycleError'
