openapi: 3.0.3
info:
  title: OMS API
  version: 1.0.0
  description: Order Management System — orders, schemes, invoices, payments, e-invoicing
    (NIC IRN/e-Way Bill) and the document tracker. Generated from the source; see
    docs/CODEBASE_AND_REFACTOR_PLAN.md for the system overview.
paths:
  /api/v1/admin/devices/:
    get:
      operationId: v1_admin_devices_retrieve
      description: GET /api/admin/devices/ — the searchable device table.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/devices/{id}/:
    get:
      operationId: v1_admin_devices_retrieve_2
      description: |-
        GET /api/admin/devices/<pk>/ — one device and its user.

        Addressed by primary key, NOT by `device_id`: device_id is unique only per
        user (a shared machine legitimately yields the same device_id for two
        users), so it is not a safe lookup key on its own.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/devices/analytics/:
    get:
      operationId: v1_admin_devices_analytics_retrieve
      description: GET /api/admin/devices/analytics/ — summary cards + chart series.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/version-policy/:
    get:
      operationId: v1_admin_version_policy_retrieve
      description: |-
        GET/PUT /api/admin/version-policy/ — the mobile version policies.

        GET returns both platforms as ``{ANDROID: {...}|null, IOS: {...}|null}`` so
        the admin form can load existing values in one call. PUT upserts ONE
        platform's active policy (there is at most one active row per platform).

        There is intentionally no list/history and no DELETE: this is a policy, not
        a release log. Editing a platform overwrites its single active row.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: v1_admin_version_policy_update
      description: |-
        GET/PUT /api/admin/version-policy/ — the mobile version policies.

        GET returns both platforms as ``{ANDROID: {...}|null, IOS: {...}|null}`` so
        the admin form can load existing values in one call. PUT upserts ONE
        platform's active policy (there is at most one active row per platform).

        There is intentionally no list/history and no DELETE: this is a policy, not
        a release log. Editing a platform overwrites its single active row.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/approvals/approvers/{id}/:
    get:
      operationId: v1_approvals_approvers_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalLevelApprover'
          description: ''
    put:
      operationId: v1_approvals_approvers_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalLevelApprover'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalLevelApprover'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalLevelApprover'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalLevelApprover'
          description: ''
    patch:
      operationId: v1_approvals_approvers_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApprovalLevelApprover'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApprovalLevelApprover'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApprovalLevelApprover'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalLevelApprover'
          description: ''
    delete:
      operationId: v1_approvals_approvers_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/approvals/inbox/:
    get:
      operationId: v1_approvals_inbox_retrieve
      description: Requests awaiting THIS user's decision.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/approvals/levels/:
    get:
      operationId: v1_approvals_levels_list
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalLevel'
          description: ''
    post:
      operationId: v1_approvals_levels_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalLevel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalLevel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalLevel'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalLevel'
          description: ''
  /api/v1/approvals/levels/{level_id}/approvers/:
    get:
      operationId: v1_approvals_levels_approvers_list
      description: Grant / list named approvers on a level.
      parameters:
      - in: path
        name: level_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApprovalLevelApprover'
          description: ''
    post:
      operationId: v1_approvals_levels_approvers_create
      description: Grant / list named approvers on a level.
      parameters:
      - in: path
        name: level_id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalLevelApprover'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalLevelApprover'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalLevelApprover'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalLevelApprover'
          description: ''
  /api/v1/approvals/levels/{id}/:
    get:
      operationId: v1_approvals_levels_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalLevel'
          description: ''
    put:
      operationId: v1_approvals_levels_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalLevel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalLevel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalLevel'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalLevel'
          description: ''
    patch:
      operationId: v1_approvals_levels_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApprovalLevel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApprovalLevel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApprovalLevel'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalLevel'
          description: ''
    delete:
      operationId: v1_approvals_levels_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/approvals/requests/:
    get:
      operationId: v1_approvals_requests_retrieve
      description: |-
        Requests visible to the caller, filterable by status/company/type.

        A PENDING request is shown only to the approvers of the level it is
        *currently* sitting on. Without that, a level-2 approver saw a document
        still waiting on level 1 — two people looking at the same entry at once,
        with no way to tell whose turn it was. Decided requests (approved,
        rejected, cancelled) stay visible to everyone as history.

        `?scope=all` opts out, for an admin overview.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/approvals/requests/{id}/:
    get:
      operationId: v1_approvals_requests_retrieve_2
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/approvals/requests/{id}/act/:
    post:
      operationId: v1_approvals_requests_act_create
      description: Approve / reject / cancel one request.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/approvals/workflows/:
    get:
      operationId: v1_approvals_workflows_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApprovalWorkflowList'
          description: ''
    post:
      operationId: v1_approvals_workflows_create
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalWorkflow'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalWorkflow'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalWorkflow'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalWorkflow'
          description: ''
  /api/v1/approvals/workflows/{id}/:
    get:
      operationId: v1_approvals_workflows_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalWorkflow'
          description: ''
    put:
      operationId: v1_approvals_workflows_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalWorkflow'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalWorkflow'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalWorkflow'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalWorkflow'
          description: ''
    patch:
      operationId: v1_approvals_workflows_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedApprovalWorkflow'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedApprovalWorkflow'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedApprovalWorkflow'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalWorkflow'
          description: ''
    delete:
      operationId: v1_approvals_workflows_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/approvals/workflows/{id}/preview/:
    get:
      operationId: v1_approvals_workflows_preview_retrieve
      description: |-
        Render the ladder a document would take, with resolved approver names.

        Without this, configuring levels is guesswork — an admin cannot otherwise
        tell whether a level has anyone able to approve it until a document
        deadlocks there.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/assign-parties/:
    post:
      operationId: v1_auth_assign_parties_create
      description: |-
        Assign parties to a user. Administrators only.

        Was `AllowAny`. Party assignment IS the data-visibility boundary for
        salespeople — an anonymous caller could grant themselves every customer in
        the company.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/assign-parties/bulk-upload/:
    post:
      operationId: v1_auth_assign_parties_bulk_upload_create
      description: Bulk party assignment from an upload. Administrators only.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/bulk-party/assign-products/:
    post:
      operationId: v1_auth_bulk_party_assign_products_create
      description: Assign multiple products to multiple parties
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/categories/:
    get:
      operationId: v1_auth_categories_list
      description: Get all categories
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'
          description: ''
  /api/v1/auth/combo-mappings/:
    get:
      operationId: v1_auth_combo_mappings_retrieve
      description: |-
        Combo packs and the free-of-cost item each one carries.

        A combo is any assigned product whose SAP name contains a "+", minus the
        bundles listed in COMBO_NAME_EXCLUDE_TERMS above. The mapping
        itself lives on `party_product_assignments`, so this view collapses the
        per-party rows into one entry per item_code/category and writes a change
        back to every one of them at once — combos give away the same product for
        every party.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_auth_combo_mappings_create
      description: |-
        Combo packs and the free-of-cost item each one carries.

        A combo is any assigned product whose SAP name contains a "+", minus the
        bundles listed in COMBO_NAME_EXCLUDE_TERMS above. The mapping
        itself lives on `party_product_assignments`, so this view collapses the
        per-party rows into one entry per item_code/category and writes a change
        back to every one of them at once — combos give away the same product for
        every party.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/companies/:
    get:
      operationId: v1_auth_companies_list
      description: Get all active companies
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Company'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Exchange credentials for a JWT pair.

        Necessarily `AllowAny`, and therefore the one endpoint that most needs a
        rate limit: nothing throttled it, so passwords could be guessed at whatever
        speed the network allowed. `ScopedRateThrottle` applies the `login` rate
        from settings (10/min per IP by default) rather than the looser `anon` one.

        Keyed by IP, which is the only identifier available before authentication.
        A shared office NAT therefore shares one bucket — the rate is set high
        enough that ordinary humans never reach it and low enough that guessing is
        hopeless.
      tags:
      - v1
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: |-
        POST /api/auth/logout/ — blacklist the refresh token so it cannot be
        reused (server-side invalidation, not just a client-side clear).
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/mainGroup/:
    get:
      operationId: v1_auth_mainGroup_list
      description: Get all active main groups
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MainGroup'
          description: ''
  /api/v1/auth/parties/{card_code}/products/:
    get:
      operationId: v1_auth_parties_products_retrieve
      description: Get all products assigned to a party with their basic_rate
      parameters:
      - in: path
        name: card_code
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/parties/{card_code}/users/:
    get:
      operationId: v1_auth_parties_users_retrieve
      description: |-
        Which users are assigned to a party. Administrators only.

        Party assignment decides which customers a salesperson can see, so both
        reading and rewriting it belong to the assignment-management screen.
      parameters:
      - in: path
        name: card_code
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/party-product/add/:
    post:
      operationId: v1_auth_party_product_add_create
      description: |-
        Add single product to party with basic_rate
        Body: {"card_code": "C001", "item_code": "FG001", "category": "OIL", "basic_rate": 150.50}
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/party-product/bulk-add/:
    post:
      operationId: v1_auth_party_product_bulk_add_create
      description: |-
        Add multiple products to a party
        Body: {
            "card_code": "C001",
            "products": [
                {"item_code": "FG001", "category": "OIL", "basic_rate": 150.50},
                {"item_code": "FG002", "category": "BEVERAGES", "basic_rate": 120.00}
            ]
        }
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/party-product/remove/:
    post:
      operationId: v1_auth_party_product_remove_create
      description: Remove a product from party
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/party-product/update-rate/:
    post:
      operationId: v1_auth_party_product_update_rate_create
      description: Update basic_rate for a party-product
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/profile/:
    get:
      operationId: v1_auth_profile_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        POST /api/auth/refresh/ — exchange a refresh token for a new access
        token, honouring rotation/blacklist settings and blocking inactive users.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActiveUserTokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActiveUserTokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActiveUserTokenRefresh'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveUserTokenRefresh'
          description: ''
  /api/v1/auth/remove-party/:
    post:
      operationId: v1_auth_remove_party_create
      description: Revoke a party assignment. Administrators only.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/roles/:
    get:
      operationId: v1_auth_roles_retrieve
      description: |-
        The role vocabulary. Any authenticated user.

        Deliberately NOT admin-only: `approvals` reads it to build the approver
        picker, and that page is open to `Payments_Dashboard` holders who are not
        administrators. It exposes role names, not who holds them.

        Had no `permission_classes` at all, which under DRF's default meant
        `AllowAny` — the silent-hole case that Phase 2.1's
        `DEFAULT_PERMISSION_CLASSES` exists to eliminate.
      tags:
      - v1
      security:
      - jwtAuth: []
