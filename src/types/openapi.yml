    patch:
      operationId: v1_tracker_invoices_payment_partial_update
      description: |-
        Capture / update payment at the terminal stage; marking it Paid
        completes the invoice.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/tracker/jsap/sync/:
    post:
      operationId: v1_tracker_jsap_sync_create
      description: |-
        Manual "refresh from JSAP" for the JSAP desk.

        Same engine as the scheduled `sync_jsap` command: approved invoices
        advance, rejected ones return to SAP Approval with JSAP's own reason,
        pending ones stay. POST with {"invoice_id": n} to sync one invoice, or no
        body to sweep the whole desk.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/tracker/lookups/:
    get:
      operationId: v1_tracker_lookups_retrieve
      description: Everything the entry form / filters need in one call.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/tracker/my-queue/:
    get:
      operationId: v1_tracker_my_queue_retrieve
      description: |-
        The actionable inbox: invoices parked at a stage this user handles.

        The head-office / entry desk is shared: any entry-desk user sees every
        invoice at the entry stage (freshly created or returned back), regardless of
        creator. Returns every stage the user works (so all their desks show as tabs
        even when empty) alongside the pending invoices.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/tracker/reports/:
    get:
      operationId: v1_tracker_reports_retrieve
      description: 'Turnaround analytics: pending, avg days/stage, bottlenecks, ageing.'
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/tracker/stage-advanced/:
    get:
      operationId: v1_tracker_stage_advanced_retrieve
      description: |-
        Invoices already advanced FORWARD from a stage (read-only history).

        Used by the entry stage's "Advanced" tab. An invoice qualifies if it has a
        closed ADVANCE event at the given stage and is no longer sitting there;
        `advanced_at` is when it last left this desk going forward.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/tracker/stage-decisions/:
    get:
      operationId: v1_tracker_stage_decisions_retrieve
      description: |-
        The decision log of a stage: what this desk decided, and what became of it.

        Every history tab reads this — Pre-Audit's Hold / OK / Debit / Sent Back,
        SAP's Approved / Rejected. It is a log of *events*, not of invoices: only a
        FULL hold keeps the invoice here (OK, DEBIT and a PARTIAL hold all advance
        it), so filtering the live queue would show almost nothing. An invoice
        debited twice appears twice, each row carrying its own amount, reason and
        handler, plus where the invoice sits now.

            ?stage=pre_audit                     OK + HOLD + DEBIT + verdicts
            ?stage=pre_audit&decision=HOLD,DEBIT
            ?stage=pre_audit&decision=RETURN     what this desk sent back
            ?stage=sap_approval&decision=APPROVED
            &include_resolved=1                  keep send-backs that came back

        Newest decision first.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/tracker/stage-export/:
    get:
      operationId: v1_tracker_stage_export_retrieve
      description: |-
        Excel export of one queue tab, in the SAME register layout as the
        All-Invoices export (`exports.build_workbook`) — same columns, same order,
        same styling, so a desk's sheet drops straight into the office's workbook.

            GET stage-export/?stage=pre_audit&tab=hold&ids=4,9,12

        `ids` is exactly what the tab is showing (so the omni-search filter carries
        through) and the order is preserved. It is not trusted for access: the ids
        are intersected with the invoices reachable from that stage — anything the
        desk has ever handled, which is precisely what its tabs can show. A decision
        log can list one invoice twice (debited twice); the register is one row per
        invoice, so duplicates collapse.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/tracker/vendors/:
    get:
      operationId: v1_tracker_vendors_retrieve
      description: |-
        SAP vendors for the entry form's searchable party dropdown (fast,
        cached, direct HANA query).
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/ui-config/admin/labels/:
    get:
      operationId: v1_ui_config_admin_labels_retrieve
      description: List every label (active or not) and create new ones. Admin only.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: v1_ui_config_admin_labels_create
      description: List every label (active or not) and create new ones. Admin only.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/ui-config/admin/labels/{id}/:
    get:
      operationId: v1_ui_config_admin_labels_retrieve_2
      description: Retrieve / update / delete a single label. Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: v1_ui_config_admin_labels_update
      description: Retrieve / update / delete a single label. Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: v1_ui_config_admin_labels_destroy
      description: Retrieve / update / delete a single label. Admin only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/ui-config/fields/:
    get:
      operationId: v1_ui_config_fields_retrieve
      description: |-
        Field-behaviour config for input fields (as opposed to plain labels).

        Returns, for EVERY row, its label plus the two behaviour flags clients need
        to render an input dynamically::

            {"po_number": {"label": "PO Number", "enabled": true, "required": false}}

        IMPORTANT: unlike ``/labels/``, this endpoint must include INACTIVE rows.
        An inactive row means the admin turned the whole entry off, which for a
        field is the same intent as "hide it". If inactive rows were omitted the
        client would fall back to its built-in default (enabled) and the field would
        reappear — the opposite of what the admin wanted. So the effective
        ``enabled`` folds in ``is_active``: a row that is inactive OR not enabled is
        reported as ``enabled: false``; ``required`` is likewise false unless the
        field is actually shown.

        Kept separate from the flat ``/labels/`` map so that endpoint stays a simple
        string→string dictionary.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/ui-config/labels/:
    get:
      operationId: v1_ui_config_labels_retrieve
      description: |-
        Flat ``{field_key: display_name}`` map of every ACTIVE label.

        This is the single source of truth both frontends fetch once after login
        and cache. Kept deliberately tiny and unwrapped for cheap client use.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
