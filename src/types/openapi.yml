          type: string
          format: uri
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedSapCompanyMap:
      type: object
      description: |-
        Company -> SAP database mapping.

        `company_db` and `hana_schema` were previously omitted, so the admin UI
        rendered blank columns for the two fields that actually matter — and there
        was no way to see or fix a mapping outside Django admin.

        `cash_gl_account` lives here rather than in the payment-method mapping for
        a physical reason: every other tender lands in a BANK, and SAP publishes
        those as House Bank Accounts (DSC1). Cash lands in a drawer, which is not a
        bank and has no DSC1 row — so there is nothing to pick from and the G/L has
        to be named directly.

        `deposit_source_gl_account` is the account a DEPOSIT credits. It is a
        second field rather than a reuse of `cash_gl_account` because SAP
        validates the two roles differently: a receipt's CashAccount must be a
        cash-flow account (OACT.Finanse='Y'), a deposit's CardCode must not be.
      properties:
        id:
          type: integer
          readOnly: true
        company:
          $ref: '#/components/schemas/CompanyEnum'
        display_name:
          type: string
          maxLength: 100
        company_db:
          type: string
          maxLength: 100
        hana_schema:
          type: string
          maxLength: 100
        default_bpl_id:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          nullable: true
        cash_gl_account:
          type: string
          maxLength: 50
        deposit_source_gl_account:
          type: string
          maxLength: 50
        is_active:
          type: boolean
        sort_order:
          type: integer
          maximum: 32767
          minimum: 0
    PatchedStorageType:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        sort_order:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
    PaymentMethodMapping:
      type: object
      description: |-
        Admin CRUD for the method -> SAP account mapping.

        The resolved SAP fields are read-only extras so the admin table can show
        the bank, G/L and account number without a second request — and so a
        mapping whose account has vanished from SAP shows up as invalid rather
        than as a plausible-looking row.
      properties:
        id:
          type: integer
          readOnly: true
        company:
          $ref: '#/components/schemas/CompanyEnum'
        payment_method:
          type: string
          maxLength: 20
        bank_key:
          type: string
          maxLength: 80
        priority:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
        resolved:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - bank_key
      - company
      - created_at
      - id
      - payment_method
      - resolved
      - updated_at
