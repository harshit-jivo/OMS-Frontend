          - $ref: '#/components/schemas/BlankEnum'
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,13}(?:\.\d{0,2})?$
          nullable: true
        receiving_note:
          oneOf:
          - $ref: '#/components/schemas/ReceivingNoteEnum'
          - $ref: '#/components/schemas/BlankEnum'
        remarks:
          type: string
        acted_by:
          type: integer
          nullable: true
        acted_by_name:
          type: string
          readOnly: true
          nullable: true
        entered_at:
          type: string
          format: date-time
        exited_at:
          type: string
          format: date-time
          nullable: true
        days_spent:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          nullable: true
      required:
