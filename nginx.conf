# ===========================================================================
#  OMS web — nginx server block
#
#  Serves the built SPA and reverse-proxies everything the Django backend
#  owns, so the browser only ever talks to ONE origin.
#
#  That single-origin choice is what makes the build portable: with the API
#  on the same origin the app calls a RELATIVE `/api`, so the same image runs
#  on localhost, staging and oms.jivo.in with no rebuild — and there is no
#  CORS preflight and no mixed-content problem behind TLS.
# ===========================================================================

upstream oms_backend {
    # `backend` is the compose service name, resolved by Docker's embedded
    # DNS. `resolve`-style re-lookup is a commercial-nginx feature, so a
    # backend that changes IP needs this container restarted — which compose
    # does anyway when the backend is recreated.
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads: label PDFs for the compliance checker and payment-receipt
    # images are the big ones. nginx's 1M default rejects these with a 413
    # BEFORE Django ever sees the request, which reads as a mystery failure
    # in the UI.
    client_max_body_size 25m;

    # Compress on the way out. Not gzip_static: the assets are hashed and
    # served once per release, so compressing on the fly costs little and
    # avoids a build step that has to stay in sync.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml
        application/javascript application/json application/xml
        image/svg+xml font/woff font/woff2;

    # --- API ---------------------------------------------------------------
    location /api/ {
        proxy_pass http://oms_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django reads this to know the request arrived over TLS. Without it,
        # an app behind an HTTPS terminator builds http:// absolute URLs and
        # any secure-cookie / redirect logic misfires.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Matches gunicorn's --timeout 120. A SAP Service Layer push or an
        # e-invoice IRN round trip can genuinely take a minute; nginx's 60s
        # default would return 504 while the backend was still working, and
        # the operator would retry an order that was in fact going through.
        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;

        # Report/export endpoints stream sizeable XLSX bodies. Buffering them
        # to disk before the first byte reaches the browser just adds latency.
        proxy_buffering off;
    }

    # --- Django-owned static + media ---------------------------------------
    # /static/ is Django admin + DRF browsable API, served by whitenoise
    # inside the backend container. /media/ is user-uploaded content, which
    # the SPA references through API_ORIGIN — relative here, so it lands on
    # this block and is proxied through.
    location ~ ^/(static|media)/ {
        proxy_pass http://oms_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- SPA assets --------------------------------------------------------
    # Vite fingerprints these (index-P-atTa8F.js), so the filename changes
    # whenever the content does and the response can be cached permanently.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # --- SPA entry point ---------------------------------------------------
    # index.html must NEVER be cached: it is the document that names the
    # current hashed bundles. A cached copy pins a browser to the previous
    # release and, once those assets are pruned, to a blank page.
    location = /index.html {
        # One directive, not two. `expires -1` would ALSO emit a
        # `Cache-Control: no-cache` of its own, so pairing it with add_header
        # sends the header twice — valid per RFC 9110 (they concatenate) but
        # a needless puzzle for whoever next debugs a stale-bundle report.
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Client-side routing: /orders, /sales-invoice and the rest are React
    # Router paths with no file behind them. Anything not matched above is
    # handed index.html so a hard refresh on a deep link works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Container-level liveness. Answered by nginx itself, so it stays useful
    # while the backend is down — which is the point: it distinguishes "web
    # is dead" from "API is dead".
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
